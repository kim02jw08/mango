<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하늘 여행 계획사이트 - Sky Travel Planner</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="clouds-background">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="cloud cloud4"></div>
        <div class="cloud cloud5"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1 class="title">
                <i class="fas fa-plane"></i>
                하늘 여행 계획사이트
            </h1>
            <p class="subtitle">원하는 나라와 일수를 입력하면 완벽한 여행 계획을 만들어드립니다</p>
        </header>

        <main class="main-content">
            <div class="input-section">
                <div class="input-group">
                    <label for="country">여행할 국가</label>
                    <select id="country" class="input-field">
                        <option value="">국가를 선택하세요</option>
                        <option value="japan">일본</option>
                        <option value="korea">한국</option>
                        <option value="thailand">태국</option>
                        <option value="vietnam">베트남</option>
                        <option value="singapore">싱가포르</option>
                        <option value="france">프랑스</option>
                        <option value="italy">이탈리아</option>
                        <option value="spain">스페인</option>
                        <option value="germany">독일</option>
                        <option value="uk">영국</option>
                        <option value="usa">미국</option>
                        <option value="canada">캐나다</option>
                        <option value="australia">호주</option>
                        <option value="newzealand">뉴질랜드</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="days">여행 일수</label>
                    <input type="number" id="days" class="input-field" placeholder="예: 5" min="1" max="30">
                </div>

                <button id="generatePlan" class="generate-btn">
                    <i class="fas fa-magic"></i>
                    여행 계획 생성하기
                </button>
            </div>

            <div id="loading" class="loading hidden">
                <div class="loading-spinner"></div>
                <p>여행 계획을 생성하고 있습니다...</p>
                <div class="loading-steps">
                    <div class="step">✓ 국가 데이터 로딩</div>
                    <div class="step">✓ 일정 생성 중</div>
                    <div class="step">✓ 타임라인 구성 중</div>
                </div>
            </div>

            <div id="travelPlan" class="travel-plan hidden">
                <div class="plan-header">
                    <h2 id="planTitle"></h2>
                    <div class="plan-meta">
                        <span id="planCountry"></span>
                        <span id="planDays"></span>
                    </div>
                </div>

                <!-- 타임라인 네비게이션 -->
                <div class="timeline-nav">
                    <button id="prevDay" class="nav-btn" disabled>
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <div class="day-indicator">
                        <span id="currentDay">1</span> / <span id="totalDays">1</span>일차
                    </div>
                    <button id="nextDay" class="nav-btn">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <!-- 타임라인 컨테이너 -->
                <div class="timeline-container">
                    <div id="timelineContent" class="timeline-content"></div>
                </div>

                <!-- 예산 섹션 -->
                <section class="plan-section budget-section">
                    <h3><i class="fas fa-calculator"></i> 예상 예산</h3>
                    <div id="budget" class="budget-details"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
